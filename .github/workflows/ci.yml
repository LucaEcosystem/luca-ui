name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes: no crates.io release, no Marketplace publish,
# no tags. Packaging steps only verify that artifacts build.
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Recreate the sibling-checkout layout the `luca-code` path
        # dependency requires: Packages/Luca UI beside Packages/Luca Code.
        working-directory: Packages/Luca UI
    steps:
      - uses: actions/checkout@v4
        with:
          path: Packages/Luca UI
      - uses: actions/checkout@v4
        with:
          repository: LucaEcosystem/luca-code
          path: Packages/Luca Code
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --check
      - name: Tests (all targets)
        run: cargo test --all-targets --all-features
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo doc --no-deps
      - name: Example smoke
        run: |
          cargo run --quiet -- examples/hello.lucu
          cargo run --quiet -- examples/declarations.lucu
          cargo run --quiet -- examples/layout.lucu
          cargo run --quiet -- examples/state.lucu
          cargo run --quiet -- examples/events.lucu
          cargo run --quiet -- examples/navigation.lucu
          cargo run --quiet -- examples/themes.lucu
          cargo run --quiet -- check examples/events.lucu
          cargo run --quiet --example render
          cargo run --quiet --example localize
      - name: Visual smoke (SVG)
        shell: bash
        run: |
          cargo run --quiet -- render examples/visual.lucu --out target/visual.svg
          test -s target/visual.svg
          head -c 4 target/visual.svg | grep -q '<svg'
      - name: Release build
        run: cargo build --release

  extension:
    name: VS Code extension (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Package (.vsix builds)
        run: npx -y @vscode/vsce package
